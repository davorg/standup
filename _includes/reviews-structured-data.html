{% assign reviews_page_url = page.url | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "@id": {{ reviews_page_url | append: "#webpage" | jsonify }},
  "url": {{ reviews_page_url | jsonify }},
  "name": {{ page.title | jsonify }},
  "isPartOf": {
    "@id": {{ site.url | append: "/#website" | jsonify }}
  },
  "mainEntity": {
    "@type": "ItemList",
    "name": {{ page.title | jsonify }},
    "itemListElement": [
      {% assign review_position = 0 %}
      {% for review in page.reviews %}
        {% if review.rating and review.text != empty %}
          {% assign review_position = review_position | plus: 1 %}
          {% assign review_slug = review.link | split: "/" | last %}
          {% assign review_url = reviews_page_url | append: "#" | append: review_slug %}
          {% assign review_author = review.author | default: page.review_author | default: page.author | default: site.social.name %}
          {% unless review_position == 1 %},{% endunless %}
          {
            "@type": "ListItem",
            "position": {{ review_position }},
            "url": {{ review_url | jsonify }},
            "item": {
              "@type": "Review",
              "@id": {{ review_url | append: "-review" | jsonify }},
              "url": {{ review_url | jsonify }},
              "name": {{ review.title | prepend: "Review: " | jsonify }},
              "reviewBody": {{ review.text | join: " " | jsonify }},
              "itemReviewed": {
                "@type": "TheaterEvent",
                "name": {{ review.title | jsonify }},
                "sameAs": {{ review.link | jsonify }},
                "location": {
                  "@type": "Place",
                  "name": {{ review.venue | jsonify }}
                }
              },
              "reviewRating": {
                "@type": "Rating",
                "ratingValue": {{ review.rating | jsonify }},
                "bestRating": 5,
                "worstRating": 1
              },
              "author": {
                "@type": "Person",
                "name": {{ review_author | jsonify }}
              },
              "publisher": {
                "@id": {{ site.url | append: "/#organization" | jsonify }}
              }
            }
          }
        {% endif %}
      {% endfor %}
    ]
  }
}
</script>
